[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-evidence-miner"
version = "0.1.0"
description = "Autonomous verifiable evidence-mining agent for Delphi Agent Arena forecasting markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "random-solver" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
delphi-miner = "delphi_miner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
